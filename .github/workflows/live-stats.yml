name: Live from GitHub tile

# Redraws assets/live.svg (repo count, followers, stars, languages, recent pushes) so the README tile stays current.
on:
  push:
    branches: [main]
    paths: [".github/scripts/**", "fonts/**"]
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours
  workflow_dispatch:             # the "Run workflow" button

permissions:
  contents: write

concurrency:
  group: live-stats
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - name: Pull real numbers from GitHub and redraw the tile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python .github/scripts/live.py
      - name: Commit if changed
        run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add assets/live.svg
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "live tile: sync $(date -u +%F)"
            git pull --rebase
            git push
          fi
