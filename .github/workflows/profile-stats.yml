name: Battle Log (live stats)

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours
  workflow_dispatch:             # "Run workflow" button
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: battle-log
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull real numbers from GitHub and redraw the SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python .github/scripts/stats.py
      - name: Commit if changed
        run: |
          git config user.name "arcade-bot"
          git config user.email "arcade-bot@users.noreply.github.com"
          git add assets/stats.svg assets/heatmap.svg
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "battle log: sync $(date -u +%F)"
            git pull --rebase
            git push
          fi
