name: Challenge Zain (fight game)

# Visitors click STRIKE / THROW / GUARD on the profile -> a pre-filled issue opens
# -> this workflow plays the round, updates the scoreboard, comments the result and closes the issue.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: challenge-zain
  cancel-in-progress: false

jobs:
  fight:
    if: startsWith(github.event.issue.title, 'fight|')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Play the round
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: python .github/scripts/fight.py
      - name: Save the scoreboard
        run: |
          git config user.name "arcade-bot"
          git config user.email "arcade-bot@users.noreply.github.com"
          git add game/state.json assets/scoreboard.svg
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "arcade: round from issue #${{ github.event.issue.number }}"
            git pull --rebase
            git push
          fi
      - name: Reply with the result and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file result.md
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --reason completed
