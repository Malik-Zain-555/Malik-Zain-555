<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="496" height="717" viewBox="0 0 496 717" role="img" aria-label="Fake News Style Detector: ~98% accuracy. TF-IDF + Logistic Regression for fake vs real news, plus an investigation of what it learned. Result: About 98% accuracy. Caveat: It learns the source's writing style, not truth. A &quot;Reuters&quot; shortcut sits in the top weights, so 98% overstates what it knows."><title>Fake News Style Detector: ~98% accuracy. TF-IDF + Logistic Regression for fake vs real news, plus an investigation of what it learned. Result: About 98% accuracy. Caveat: It learns the source's writing style, not truth. A "Reuters" shortcut sits in the top weights, so 98% overstates what it knows.</title><defs><style>@font-face{font-family:'Unbounded';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Hanken Grotesk';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Hanken Grotesk';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}.d{font-family:'Unbounded','Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:800}.f{font-family:'Hanken Grotesk','Helvetica Neue',Arial,system-ui,sans-serif;font-weight:400}.b{font-weight:600}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style><clipPath id="c1"><rect x="12" y="12" width="472" height="693" rx="30"/></clipPath></defs><rect x="0" y="0" width="496" height="717" rx="36" fill="#f4f4ef"/><rect x="12" y="12" width="472" height="693" rx="30" fill="#fff"/><rect x="30" y="30" width="436" height="206" rx="20" fill="#ffb3d1"/><g transform="translate(30.0 30.1) scale(1.211)"><circle cx="110" cy="85" r="52" fill="none" stroke="#0c0c16" stroke-opacity=".2" stroke-width="18"/><circle cx="110" cy="85" r="52" fill="none" stroke="#0c0c16" stroke-width="18" stroke-dasharray="320 327" transform="rotate(-90 110 85)"><animate attributeName="stroke-dasharray" values="0 327;320 327;320 327" keyTimes="0;.35;1" dur="6s" repeatCount="indefinite"/></circle><text x="110.0" y="92.0" class="d" font-size="20" fill="#0c0c16" text-anchor="middle" letter-spacing="-0.80" >~98%</text><text x="190.0" y="70.0" class="f" font-size="20" fill="#0c0c16" >truth?</text><path d="M188 76H254" stroke="#e5383b" stroke-width="5"/><text x="190.0" y="116.0" class="f b" font-size="17" fill="#c1121f" >source’s style</text></g><text x="30.0" y="294.0" class="d" font-size="42" fill="#0c0c16" letter-spacing="-2.10" >~98%</text><text x="187.5" y="294.0" class="f" font-size="15" fill="#0c0c16" fill-opacity="0.6" >accuracy</text><text x="30.0" y="328.0" class="d" font-size="20" fill="#0c0c16" letter-spacing="-0.60" >Fake News Style Detector</text><text x="30.0" y="355.0" class="f" font-size="17.5" fill="#0c0c16" fill-opacity="0.78" >TF-IDF + Logistic Regression for fake vs real news, plus</text><text x="30.0" y="380.0" class="f" font-size="17.5" fill="#0c0c16" fill-opacity="0.78" >an investigation of what it learned.</text><rect x="30.8" y="405.8" width="91.1" height="26" rx="13" fill="none" stroke="#0c0c16" stroke-width="1.5"/><text x="41.0" y="423.5" class="f b" font-size="14" fill="#0c0c16" >scikit-learn</text><rect x="129.4" y="405.8" width="62.0" height="26" rx="13" fill="none" stroke="#0c0c16" stroke-width="1.5"/><text x="139.6" y="423.5" class="f b" font-size="14" fill="#0c0c16" >TF-IDF</text><rect x="31" y="448" width="94.8" height="38" rx="19" fill="#0c0c16" stroke="#0c0c16" stroke-width="2"/><text x="46.0" y="472.0" class="f b" font-size="16" fill="#fff" >Repo</text><path d="M91.816 467H102.0M97.5 462.5L102.0 467L97.5 471.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><g clip-path="url(#c1)"><path d="M12 525a24 24 0 0 1 24-24H460a24 24 0 0 1 24 24V705H12z" fill="#0c0c16"/></g><text x="30.0" y="537.0" class="f b" font-size="16.5" fill="#ffb3d1" >Result</text><text x="30.0" y="561.0" class="f" font-size="16.5" fill="#fff" >About 98% accuracy.</text><text x="30.0" y="598.0" class="f b" font-size="16.5" fill="#ffb3d1" >Caveat</text><text x="30.0" y="622.0" class="f" font-size="16.5" fill="#fff" >It learns the source’s writing style, not truth. A “Reuters”</text><text x="30.0" y="645.0" class="f" font-size="16.5" fill="#fff" >shortcut sits in the top weights, so 98% overstates what it</text><text x="30.0" y="668.0" class="f" font-size="16.5" fill="#fff" >knows.</text></svg>