<svg xmlns="http://www.w3.org/2000/svg" width="430" height="246" viewBox="0 0 430 246" fill="none" role="img" aria-label="Stage 3: Ochi Website Clone. Frontend &amp; Motion Experiment.">
<title>Stage 3: Ochi Website Clone. Frontend &amp; Motion Experiment.</title>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".45" stop-color="#FFD23F"/><stop offset="1" stop-color="#FF2E4D"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2E4D"/><stop offset=".55" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FFD23F"/></linearGradient>
<linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#22E5FF"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" fill-opacity=".30"/></pattern>
<pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#FFD23F"/><rect x="8" width="8" height="16" fill="#07060B"/></pattern>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><polygon points="16,0 430,0 430,230 414,246 0,246 0,16"/></clipPath>

</defs>
<g clip-path="url(#card)"><rect width="430" height="246" fill="#0E0B14"/><defs><clipPath id="strip"><rect width="430" height="96"/></clipPath></defs><rect width="430" height="96" fill="#A855F7" fill-opacity=".07"/><g clip-path="url(#strip)"><circle cy="48" r="22" stroke="#A855F7" stroke-opacity="0.8" stroke-width="2.5"><animate attributeName="cx" values="150;280;150" calcMode="spline" dur="4s" begin="0s" repeatCount="indefinite" keySplines="0.5 0 0.5 1;0.5 0 0.5 1" keyTimes="0;.5;1"/></circle><circle cy="48" r="32" stroke="#A855F7" stroke-opacity="0.6000000000000001" stroke-width="2.5"><animate attributeName="cx" values="170;260;170" calcMode="spline" dur="5s" begin="0s" repeatCount="indefinite" keySplines="0.5 0 0.5 1;0.5 0 0.5 1" keyTimes="0;.5;1"/></circle><circle cy="48" r="42" stroke="#A855F7" stroke-opacity="0.4" stroke-width="2.5"><animate attributeName="cx" values="190;240;190" calcMode="spline" dur="6s" begin="0s" repeatCount="indefinite" keySplines="0.5 0 0.5 1;0.5 0 0.5 1" keyTimes="0;.5;1"/></circle></g><rect y="95" width="430" height="2" fill="#A855F7"/><polygon points="0,0 96,0 84,24 0,24" fill="#A855F7"/><text x="12" y="17" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2" fill="#07060B" font-weight="700">STAGE 03</text><g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.5000;0.5000;1.0000" dur="1.1s" begin="0s" repeatCount="indefinite" /><text x="414" y="20" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" letter-spacing="2" fill="#F5F3FF" >▶ ENTER</text></g><text x="20" y="128" text-anchor="start" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="28" font-style="italic" letter-spacing=".6" fill="#F5F3FF" >OCHI WEBSITE CLONE</text><text x="20" y="148" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1.5" fill="#A855F7" >FRONTEND &amp; MOTION EXPERIMENT</text><text x="20" y="172" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#C9C3DE" >A recreation inspired by Ochi.design: composition,</text><text x="20" y="191" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#C9C3DE" >animation, and polished landing-page interactions.</text><rect x="20" y="212" width="57" height="22" fill="#A855F7" fill-opacity=".12" stroke="#A855F7" stroke-opacity=".5"/><text x="48.5" y="227" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="0" fill="#A855F7" >React</text><rect x="85" y="212" width="50" height="22" fill="#A855F7" fill-opacity=".12" stroke="#A855F7" stroke-opacity=".5"/><text x="110.0" y="227" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="0" fill="#A855F7" >GSAP</text><rect x="143" y="212" width="116" height="22" fill="#A855F7" fill-opacity=".12" stroke="#A855F7" stroke-opacity=".5"/><text x="201.0" y="227" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="0" fill="#A855F7" >Framer Motion</text><rect x="1" y="1" width="428" height="244" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="120 1352" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-1472" dur="7s" begin="-2.4s" repeatCount="indefinite" /></rect><rect width="430" height="246" fill="url(#scan)" opacity=".55"/></g><polygon points="16,0 430,0 430,230 414,246 0,246 0,16" 