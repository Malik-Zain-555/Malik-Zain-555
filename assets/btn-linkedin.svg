<g>

<rect x="1" y="1" width="218" height="54" rx="28" fill="#60A5FA" fill-opacity=".10" stroke="#60A5FA" stroke-opacity=".65" stroke-width="1.5"/>
<defs><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<rect x="-90" y="0" width="70" height="56" fill="url(#shine)" transform="skewX(-20)"><animate attributeName="x" values="-90;260;260" keyTimes="0;.45;1" dur="4.5s" repeatCount="indefinite"/></rect>
<circle cx="34" cy="28.0" r="5" fill="#60A5FA" filter="url(#glow)"/>
<text x="54" y="33.5" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="700" letter-spacing="1.2" fill="#E6E8F5">LINKEDIN</text>
<text x="190" y="34.0" text-anchor="end" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#60A5FA">→</text>

