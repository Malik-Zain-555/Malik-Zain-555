<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" fill="none" role="img" aria-label="Battle log: live GitHub numbers">
<title>Battle log: live GitHub numbers</title>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".45" stop-color="#FFD23F"/><stop offset="1" stop-color="#FF2E4D"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2E4D"/><stop offset=".55" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FFD23F"/></linearGradient>
<linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#22E5FF"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" fill-opacity=".30"/></pattern>
<pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#FFD23F"/><rect x="8" width="8" height="16" fill="#07060B"/></pattern>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><polygon points="14,0 880,0 880,286 866,300 0,300 0,14"/></clipPath>

</defs>
<g clip-path="url(#card)"><rect width="880" height="300" fill="#0E0B14"/><circle cx="780" cy="40" r="140" fill="#FF8A1F" fill-opacity="0.12" filter="url(#blur)"/><g transform="translate(1 22)"><polygon points="10,0 138,0 138,82 128,92 0,92 0,10" fill="#22E5FF" fill-opacity=".08" stroke="#22E5FF" stroke-opacity=".6" stroke-width="1.5"/><text x="69.0" y="60" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="44" font-style="italic" letter-spacing=".6" fill="#22E5FF" >--</text><text x="69.0" y="82" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2" fill="#C9C3DE" >REPOS</text></g><g transform="translate(149 22)"><polygon points="10,0 138,0 138,82 128,92 0,92 0,10" fill="#A855F7" fill-opacity=".08" stroke="#A855F7" stroke-opacity=".6" stroke-width="1.5"/><text x="69.0" y="60" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="44" font-style="italic" letter-spacing=".6" fill="#A855F7" >--</text><text x="69.0" y="82" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2" fill="#C9C3DE" >FOLLOWERS</text></g><g transform="translate(297 22)"><polygon points="10,0 138,0 138,82 128,92 0,92 0,10" fill="#FFD23F" fill-opacity=".08" stroke="#FFD23F" stroke-opacity=".6" stroke-width="1.5"/><text x="69.0" y="60" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="44" font-style="italic" letter-spacing=".6" fill="#FFD23F" >--</text><text x="69.0" y="82" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2" fill="#C9C3DE" >STARS</text></g><g transform="translate(445 22)"><polygon points="10,0 138,0 138,82 128,92 0,92 0,10" fill="#FF8A1F" fill-opacity=".08" stroke="#FF8A1F" stroke-opacity=".6" stroke-width="1.5"/><text x="69.0" y="60" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="44" font-style="italic" letter-spacing=".6" fill="#FF8A1F" >--</text><text x="69.0" y="82" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2" fill="#C9C3DE" >THIS YEAR</text></g><g transform="translate(593 22)"><polygon points="10,0 138,0 138,82 128,92 0,92 0,10" fill="#FF2E4D" fill-opacity=".08" stroke="#FF2E4D" stroke-opacity=".6" stroke-width="1.5"/><text x="69.0" y="60" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="44" font-style="italic" letter-spacing=".6" fill="#FF2E4D" >--</text><text x="69.0" y="82" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2" fill="#C9C3DE" >STREAK</text></g><g transform="translate(741 22)"><polygon points="10,0 138,0 138,82 128,92 0,92 0,10" fill="#FF5FA2" fill-opacity=".08" stroke="#FF5FA2" stroke-opacity=".6" stroke-width="1.5"/><text x="69.0" y="60" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="44" font-style="italic" letter-spacing=".6" fill="#FF5FA2" >--</text><text x="69.0" y="82" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2" fill="#C9C3DE" >BEST STREAK</text></g><text x="28" y="150" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="4" fill="#FFD23F" >TOP LANGUAGES</text><rect x="28" y="164" width="824" height="22" fill="#2B2040"/><line x1="28" y1="250" x2="852" y2="250" stroke="#2B2040"/><text x="28" y="278" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="1.5" fill="#8F88AD" >LAST SYNC  waiting for first sync</text><text x="852" y="278" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="1.5" fill="#8F88AD" >AUTO-UPDATES EVERY 6 HOURS</text><rect x="-220" y="297" width="220" height="3" fill="url(#hot)" opacity=".9"><animate attributeName="x" from="-220" to="880" dur="6s" begin="0s" repeatCount="indefinite"/></rect><rect width="880" height="300" fill="url(#scan)" opacity=".55"/></g><polygon points="14,0 880,0 880,286 866,300 0,300 0,14" stroke="#2B2040" stroke-width="1.5"/>
</svg>
