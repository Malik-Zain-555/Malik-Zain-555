<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" fill="none" role="img" aria-label="Selected Builds — section header">
<title>Selected Builds — section header</title>
<defs>
<linearGradient id="aur" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<clipPath id="card"><rect width="1200" height="92" rx="22"/></clipPath>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".09"/></pattern>
<radialGradient id="fadeg" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="fade"><rect width="1200" height="92" fill="url(#fadeg)"/></mask>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

</defs>
<g clip-path="url(#card)"><rect width="1200" height="92" fill="#0B0D1A"/><rect width="1200" height="92" fill="url(#dots)" mask="url(#fade)"/><circle cx="1100" cy="20" r="120" fill="#F472B6" fill-opacity="0.18" filter="url(#blur)"/>

<rect x="0" y="0" width="7" height="92" fill="url(#aur)"/>
<text x="38" y="36" font-family="ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="3" fill="#F472B6">// 03</text>
<text x="36" y="72" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="-.5" fill="#E6E8F5">Selected Builds</text>
<text x="1164" y="58" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#8B91B5">click a card → source</text>
<rect x="-240" y="89" width="240" height="3" fill="url(#aur)" opacity=".9"><animate attributeName="x" from="-240" to="1200" dur="5s" begin="0s" repeatCount="indefinite"/></rect>

</g>
<rect x=".5" y=".5" width="1199" height="91" rx="22" stroke="#1B1F3B"/>
</svg>
