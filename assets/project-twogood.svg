<svg xmlns="http://www.w3.org/2000/svg" width="580" height="280" viewBox="0 0 580 280" fill="none" role="img" aria-label="Two Good Website Clone: Website Recreation">
<title>Two Good Website Clone: Website Recreation</title>
<defs>
<linearGradient id="aur" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<clipPath id="card"><rect width="580" height="280" rx="24"/></clipPath>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".09"/></pattern>
<radialGradient id="fadeg" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="fade"><rect width="580" height="280" fill="url(#fadeg)"/></mask>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

</defs>
<g clip-path="url(#card)"><rect width="580" height="280" fill="#0B0D1A"/><rect width="580" height="280" fill="url(#dots)" mask="url(#fade)"/><circle cx="540" cy="20" r="130" fill="#A3E635" fill-opacity="0.16" filter="url(#blur)"/>

<text x="36" y="50" font-family="ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" letter-spacing="2" fill="#8B91B5"><tspan fill="#A3E635" font-weight="700">05</tspan>  /  WEBSITE RECREATION</text>
<text x="544" y="50" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" letter-spacing="1.5" fill="#E6E8F5" fill-opacity=".8">VIEW SOURCE ↗</text>
<text x="36" y="102" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="31" font-weight="800" letter-spacing="-.6" fill="#E6E8F5">Two Good Website Clone</text>
<text x="36" y="140" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#AEB4D6">Frontend practice with animated sections, scroll</text><text x="36" y="163" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#AEB4D6">interactions, and page composition.</text><rect x="36" y="218" width="56" height="28" rx="14" fill="#A3E635" fill-opacity=".10" stroke="#A3E635" stroke-opacity=".40"/><text x="64.0" y="236.5" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#A3E635">HTML</text><rect x="102" y="218" width="49" height="28" rx="14" fill="#A3E635" fill-opacity=".10" stroke="#A3E635" stroke-opacity=".40"/><text x="126.5" y="236.5" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#A3E635">CSS</text><rect x="161" y="218" width="102" height="28" rx="14" fill="#A3E635" fill-opacity=".10" stroke="#A3E635" stroke-opacity=".40"/><text x="212.0" y="236.5" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#A3E635">JavaScript</text><rect x="273" y="218" width="56" height="28" rx="14" fill="#A3E635" fill-opacity=".10" stroke="#A3E635" stroke-opacity=".40"/><text x="301.0" y="236.5" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#A3E635">GSAP</text><rect x="1.2" y="1.2" width="577.6" height="277.6" rx="23" stroke="#A3E635" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="150 1544" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="0" to="-1694" dur="7s" begin="-5.2s" repeatCount="indefinite"/></rect>
</g>
