<svg xmlns="http://www.w3.org/2000/svg" width="430" height="246" viewBox="0 0 430 246" fill="none" role="img" aria-label="Stage 5: Two Good Website Clone. Website Recreation.">
<title>Stage 5: Two Good Website Clone. Website Recreation.</title>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".45" stop-color="#FFD23F"/><stop offset="1" stop-color="#FF2E4D"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2E4D"/><stop offset=".55" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FFD23F"/></linearGradient>
<linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#22E5FF"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" fill-opacity=".30"/></pattern>
<pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#FFD23F"/><rect x="8" width="8" height="16" fill="#07060B"/></pattern>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><polygon points="16,0 430,0 430,230 414,246 0,246 0,16"/></clipPath>

</defs>
<g clip-path="url(#card)"><rect width="430" height="246" fill="#0E0B14"/><defs><clipPath id="strip"><rect width="430" height="96"/></clipPath></defs><rect width="430" height="96" fill="#A3E635" fill-opacity=".07"/><g clip-path="url(#strip)"><g><animateTransform attributeName="transform" type="translate" values="40 0;-40 0;40 0" dur="5s" begin="0s" repeatCount="indefinite" /><rect x="30" y="12" width="300" height="14" fill="#A3E635" fill-opacity="0.25"/></g><g><animateTransform attributeName="transform" type="translate" values="-40 0;40 0;-40 0" dur="6s" begin="0s" repeatCount="indefinite" /><rect x="30" y="34" width="330" height="14" fill="#A3E635" fill-opacity="0.4"/></g><g><animateTransform attributeName="transform" type="translate" values="40 0;-40 0;40 0" dur="7s" begin="0s" repeatCount="indefinite" /><rect x="30" y="56" width="360" height="14" fill="#A3E635" fill-opacity="0.55"/></g><g><animateTransform attributeName="transform" type="translate" values="-40 0;40 0;-40 0" dur="8s" begin="0s" repeatCount="indefinite" /><rect x="30" y="78" width="390" height="14" fill="#A3E635" fill-opacity="0.7"/></g></g><rect y="95" width="430" height="2" fill="#A3E635"/><polygon points="0,0 96,0 84,24 0,24" fill="#A3E635"/><text x="12" y="17" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2" fill="#07060B" font-weight="700">STAGE 05</text><g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.5000;0.5000;1.0000" dur="1.1s" begin="0s" repeatCount="indefinite" /><text x="414" y="20" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" letter-spacing="2" fill="#F5F3FF" >▶ ENTER</text></g><text x="20" y="128" text-anchor="start" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="25" font-style="italic" letter-spacing=".6" fill="#F5F3FF" >TWO GOOD WEBSITE CLONE</text><text x="20" y="148" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1.5" fill="#A3E635" >WEBSITE RECREATION</text><text x="20" y="172" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#C9C3DE" >Animated sections, scroll interactions, and page</text><text x="20" y="191" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#C9C3DE" >composition practice.</text><rect x="20" y="212" width="50" height="22" fill="#A3E635" fill-opacity=".12" stroke="#A3E635" stroke-opacity=".5"/><text x="45.0" y="227" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="0" fill="#A3E635" >HTML</text><rect x="78" y="212" width="42" height="22" fill="#A3E635" fill-opacity=".12" stroke="#A3E635" stroke-opacity=".5"/><text x="99.0" y="227" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="0" fill="#A3E635" >CSS</text><rect x="128" y="212" width="94" height="22" fill="#A3E635" fill-opacity=".12" stroke="#A3E635" stroke-opacity=".5"/><text x="175.0" y="227" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="0" fill="#A3E635" >JavaScript</text><rect x="230" y="212" width="50" height="22" fill="#A3E635" fill-opacity=".12" stroke="#A3E635" stroke-opacity=".5"/><text x="255.0" y="227" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="0" fill="#A3E635" >GSAP</text><r