<svg xmlns="http://www.w3.org/2000/svg" width="210" height="54" viewBox="0 0 210 54" fill="none" role="img" aria-label="PROJECTS">
<title>PROJECTS</title>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".45" stop-color="#FFD23F"/><stop offset="1" stop-color="#FF2E4D"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2E4D"/><stop offset=".55" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FFD23F"/></linearGradient>
<linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#22E5FF"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" fill-opacity=".30"/></pattern>
<pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#FFD23F"/><rect x="8" width="8" height="16" fill="#07060B"/></pattern>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><polygon points="14,0 210,0 210,40 196,54 0,54 0,14"/></clipPath>

</defs>
<g><polygon points="14,0 210,0 196,54 0,54" fill="#0E0B14"/><polygon points="14,0 210,0 196,54 0,54" fill="#22E5FF" fill-opacity=".16" stroke="#22E5FF" stroke-width="2"/>
<defs><linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="bp"><polygon points="14,0 210,0 196,54 0,54"/></clipPath></defs>
<g clip-path="url(#bp)"><rect x="-80" width="60" height="54" fill="url(#sh)" transform="skewX(-20)"><animate attributeName="x" values="-80;250;250" keyTimes="0.0000;0.4000;1.0000" dur="4.2s" begin="0s" repeatCount="indefinite" /></rect></g>
<text x="97.0" y="35.0" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="24" font-style="italic" letter-spacing=".6" fill="#F5F3FF" >PROJECTS</text>
<g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.5000;0.5000;1.0000" dur="1s" begin="0s" repeatCount="indefinite" /><text x="176" y="32.0" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" letter-spacing="0" fill="#22E5FF" >▶</text></g></g>
</svg>
