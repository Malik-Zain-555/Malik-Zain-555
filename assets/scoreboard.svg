<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" fill="none" role="img" aria-label="Arena scoreboard: challengers 0, Zain 0">
<title>Arena scoreboard: challengers 0, Zain 0</title>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".45" stop-color="#FFD23F"/><stop offset="1" stop-color="#FF2E4D"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2E4D"/><stop offset=".55" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FFD23F"/></linearGradient>
<linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#22E5FF"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" fill-opacity=".30"/></pattern>
<pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#FFD23F"/><rect x="8" width="8" height="16" fill="#07060B"/></pattern>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><polygon points="14,0 880,0 880,378 866,392 0,392 0,14"/></clipPath>

</defs>
<g clip-path="url(#card)"><rect width="880" height="392" fill="#0E0B14"/><circle cx="220" cy="140" r="150" fill="#22E5FF" fill-opacity="0.12" filter="url(#blur)"/><circle cx="660" cy="140" r="150" fill="#FFD23F" fill-opacity="0.12" filter="url(#blur)"/><text x="28" y="42" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="4" fill="#FFD23F" >ARENA SCOREBOARD</text><text x="852" y="42" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="2" fill="#8F88AD" >ROUNDS PLAYED  0</text><line x1="28" y1="58" x2="852" y2="58" stroke="#2B2040"/><text x="220" y="96" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="5" fill="#22E5FF" >CHALLENGERS</text><text x="220" y="178" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="96" font-style="italic" letter-spacing=".6" fill="#22E5FF" >0</text><text x="660" y="96" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="5" fill="#FFD23F" >ZAIN</text><text x="660" y="178" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="96" font-style="italic" letter-spacing=".6" fill="url(#gold)" >0</text><g transform="translate(440 150)"><g><animateTransform attributeName="transform" type="scale" values="1;1.18;1" dur="1.6s" begin="0s" repeatCount="indefinite" /><text x="0" y="22" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="78" font-style="italic" letter-spacing=".6" fill="#FF2E4D" stroke="#000" stroke-width="5" paint-order="stroke">VS</text></g></g><text x="440" y="214" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="1.5" fill="#C9C3DE" >DRAWS 0   ·   CHALLENGER STREAK 0   ·   BEST STREAK 0</text><line x1="28" y1="232" x2="852" y2="232" stroke="#2B2040"/><text x="28" y="256" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="4" fill="#8F88AD" >LAST ROUNDS</text><g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.5000;0.5000;1.0000" dur="2.4s" begin="0s" repeatCount="indefinite" /><text x="440" y="312" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" letter-spacing="2" fill="#C9C3DE" >NO FIGHTS YET — BE THE FIRST CHALLENGER</text></g><rect x="-220" y="389" width="220" height="3" fill="url(#hot)" opacity=".9"><animate attributeName="x" from="-220" to="880" dur="5s" begin="0s" repeatCount="indefinite"/></rect><rect width="880" height="392" fill="url(#scan)" opacity=".55"/></g><polygon points="14,0 880,0 880,378 866,392 0,392 0,14" stroke="#2B2040" stroke-width="1.5"/>
</svg>
