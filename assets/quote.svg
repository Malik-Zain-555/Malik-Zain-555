<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" fill="none" role="img" aria-label="Never stop because life is not end yet">
<title>Never stop because life is not end yet</title>
<defs>
<linearGradient id="aur" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<clipPath id="card"><rect width="1200" height="176" rx="26"/></clipPath>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".09"/></pattern>
<radialGradient id="fadeg" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="fade"><rect width="1200" height="176" fill="url(#fadeg)"/></mask>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

</defs>
<g clip-path="url(#card)"><rect width="1200" height="176" fill="#0B0D1A"/><rect width="1200" height="176" fill="url(#dots)" mask="url(#fade)"/><circle cx="180" cy="90" r="160" fill="#8B5CF6" fill-opacity="0.25" filter="url(#blur)"/><circle cx="1050" cy="100" r="160" fill="#22D3EE" fill-opacity="0.18" filter="url(#blur)"/>

<text x="34" y="150" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="170" font-weight="800" fill="url(#aur)" opacity=".95">“</text>
<text x="610" y="78" text-anchor="middle" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="-.5" fill="#E6E8F5">Never stop because life is not end yet.</text>
<text x="610" y="122" text-anchor="middle" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#AEB4D6">I don't need to know everything today. I need to keep learning,</text>
<text x="610" y="146" text-anchor="middle" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#AEB4D6">build honestly, and get a little better with every project.</text>
<rect x="-240" y="173" width="240" height="3" fill="url(#aur)" opacity=".9"><animate attributeName="x" from="-240" to="1200" dur="7s" begin="0s" repeatCount="indefinite"/></rect>

</g>
<rect x=".5" y=".5" width="1199" height="175" rx="26" stroke="#1B1F3B"/>
</svg>
