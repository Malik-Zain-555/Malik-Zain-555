<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" fill="none" role="img" aria-label="Never stop because life is not end yet">
<title>Never stop because life is not end yet</title>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".45" stop-color="#FFD23F"/><stop offset="1" stop-color="#FF2E4D"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2E4D"/><stop offset=".55" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FFD23F"/></linearGradient>
<linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#22E5FF"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" fill-opacity=".30"/></pattern>
<pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#FFD23F"/><rect x="8" width="8" height="16" fill="#07060B"/></pattern>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><polygon points="14,0 880,0 880,186 866,200 0,200 0,14"/></clipPath>

</defs>
<g clip-path="url(#card)"><rect width="880" height="200" fill="#0E0B14"/><circle cx="60" cy="100" r="140" fill="#FF2E4D" fill-opacity="0.22" filter="url(#blur)"/><circle cx="820" cy="160" r="140" fill="#A855F7" fill-opacity="0.2" filter="url(#blur)"/><rect width="12" height="200" fill="url(#haz)"/><text x="44" y="40" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="5" fill="#FFD23F" >// MOTTO</text><text x="44" y="100" text-anchor="start" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="46" font-style="italic" letter-spacing=".6" fill="url(#gold)" stroke="#000" stroke-width="5" paint-order="stroke">NEVER STOP BECAUSE</text><text x="44" y="152" text-anchor="start" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="46" font-style="italic" letter-spacing=".6" fill="url(#hot)" stroke="#000" stroke-width="5" paint-order="stroke">LIFE IS NOT END YET.</text><text x="850" y="112" text-anchor="end" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C3DE" >I don't need to know everything today.</text><text x="850" y="134" text-anchor="end" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C3DE" >I need to keep learning, build honestly,</text><text x="850" y="156" text-anchor="end" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C3DE" >and get a little better every project.</text><rect x="-220" y="197" width="220" height="3" fill="url(#hot)" opacity=".9"><animate attributeName="x" from="-220" to="880" dur="7s" begin="0s" repeatCount="indefinite"/></rect><rect width="880" height="200" fill="url(#scan)" opacity=".55"/></g><polygon points="14,0 880,0 880,186 866,200 0,200 0,14" stroke="#2B2040" stroke-width="1.5"/>
</svg>
