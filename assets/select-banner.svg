<svg xmlns="http://www.w3.org/2000/svg" width="880" height="86" viewBox="0 0 880 86" fill="none" role="img" aria-label="Character select: choose your path">
<title>Character select: choose your path</title>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".45" stop-color="#FFD23F"/><stop offset="1" stop-color="#FF2E4D"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2E4D"/><stop offset=".55" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FFD23F"/></linearGradient>
<linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#22E5FF"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" fill-opacity=".30"/></pattern>
<pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#FFD23F"/><rect x="8" width="8" height="16" fill="#07060B"/></pattern>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><polygon points="16,0 880,0 880,70 864,86 0,86 0,16"/></clipPath>

</defs>
<g clip-path="url(#card)"><rect width="880" height="86" fill="#0E0B14"/><circle cx="440" cy="35" r="160" fill="#FF2E4D" fill-opacity="0.2" filter="url(#blur)"/><text x="440.0" y="52" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="46" font-style="italic" letter-spacing=".6" fill="url(#gold)" stroke="#000" stroke-width="5" paint-order="stroke">CHARACTER  SELECT</text><g><animate attributeName="x" values="0;-8;0" dur="1s" begin="0s" repeatCount="indefinite" /><text x="70" y="54" text-anchor="start" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="40" font-style="italic" letter-spacing=".6" fill="#FF2E4D" >◀</text></g><text x="810" y="54" text-anchor="end" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="40" font-style="italic" letter-spacing=".6" fill="#FF2E4D" >▶</text><text x="440.0" y="76" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="5" fill="#8F88AD" >CLICK A PATH TO JUMP IN</text><rect width="880" height="86" fill="url(#scan)" opacity=".55"/></g><polygon points="16,0 880,0 880,70 864,86 0,86 0,16" stroke="#2B2040" stroke-width="1.5"/>
</svg>
