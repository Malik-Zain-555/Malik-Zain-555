nt="indefinite" keyTimes="0;1" keySplines="0.6 0 0.9 0.5"/></line><line x1="0" x2="880" y1="120" y2="120" stroke="#22E5FF" stroke-width="1.5"><animate attributeName="y1" values="120;220" calcMode="spline" dur="4s" begin="-2s" repeatCount="indefinite" keyTimes="0;1" keySplines="0.6 0 0.9 0.5"/><animate attributeName="y2" values="120;220" calcMode="spline" dur="4s" begin="-2s" repeatCount="indefinite" keyTimes="0;1" keySplines="0.6 0 0.9 0.5"/></line><line x1="0" x2="880" y1="120" y2="120" stroke="#22E5FF" stroke-width="1.5"><animate attributeName="y1" values="120;220" calcMode="spline" dur="4s" begin="-3s" repeatCount="indefinite" keyTimes="0;1" keySplines="0.6 0 0.9 0.5"/><animate attributeName="y2" values="120;220" calcMode="spline" dur="4s" begin="-3s" repeatCount="indefinite" keyTimes="0;1" keySplines="0.6 0 0.9 0.5"/></line><text x="440" y="70" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="60" font-style="italic" letter-spacing=".6" fill="url(#gold)" stroke="#000" stroke-width="6" paint-order="stroke">THANKS FOR PLAYING</text><text x="440" y="104" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" letter-spacing="1" fill="#22E5FF" >while (alive) { learn(); build(); improve(); }</text><g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.5000;0.5000;1.0000" dur="1.2s" begin="0s" repeatCount="indefinite" /><text x="440" y="196" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="3" fill="#FFD23F" >CREDIT 01  ·  STILL LEARNING · STILL BUILDING · STILL GOING</text></g><rect width="880" height="220" fill="url(#scan)" opacity=".55"/></g><polygon points="22,0 880,0 880,198 858,220 0,220 0,22" stroke="#2B2040" stroke-width="1.5"/>
