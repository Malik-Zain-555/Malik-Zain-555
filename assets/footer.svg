<g clip-path="url(#card)"><rect width="880" height="140" fill="#111317"/><text x="440.0" y="62" text-anchor="middle" font-family="Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif" font-size="30" font-weight="400" font-style="italic" fill="#F3F0EA" >Never stop because life is not end yet.</text><text x="440.0" y="96" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="3" fill="#80848E" >ZAIN ALI  ·  ISLAMABAD  ·  I LEARN BY BUILDING</text><line x1="0" y1="139" x2="880" y2="139" stroke="#272B33"/><rect x="-120" y="138" width="120" height="2" fill="#FF6B3D"><animate attributeName="x" from="-120" to="880" dur="7s" begin="0s" repeatCount="indefinite"/></rect></g><rect x=".5" y=".5" width="879" height="139" rx="22" stroke="#272B33"/>
