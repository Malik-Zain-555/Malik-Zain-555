<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170" fill="none" role="img" aria-label="Continue? Nine, eight, seven... press any button to talk.">
<title>Continue? Nine, eight, seven... press any button to talk.</title>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".45" stop-color="#FFD23F"/><stop offset="1" stop-color="#FF2E4D"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2E4D"/><stop offset=".55" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FFD23F"/></linearGradient>
<linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#22E5FF"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" fill-opacity=".30"/></pattern>
<pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#FFD23F"/><rect x="8" width="8" height="16" fill="#07060B"/></pattern>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><polygon points="20,0 880,0 880,150 860,170 0,170 0,20"/></clipPath>

</defs>
<g clip-path="url(#card)"><rect width="880" height="170" fill="#0E0B14"/><circle cx="770" cy="90" r="130" fill="#FF2E4D" fill-opacity="0.3" filter="url(#blur)"/><text x="36" y="112" text-anchor="start" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="96" font-style="italic" letter-spacing=".6" fill="url(#hot)" stroke="#000" stroke-width="6" paint-order="stroke">CONTINUE?</text><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.0;0.1;1" dur="10s" repeatCount="indefinite"/><text x="770" y="128" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="120" font-style="italic" letter-spacing=".6" fill="url(#gold)" stroke="#000" stroke-width="6" paint-order="stroke">9</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.1;0.2;1" dur="10s" repeatCount="indefinite"/><text x="770" y="128" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="120" font-style="italic" letter-spacing=".6" fill="url(#gold)" stroke="#000" stroke-width="6" paint-order="stroke">8</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.2;0.3;1" dur="10s" repeatCount="indefinite"/><text x="770" y="128" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="120" font-style="italic" letter-spacing=".6" fill="url(#gold)" stroke="#000" stroke-width="6" paint-order="stroke">7</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.3;0.4;1" dur="10s" repeatCount="indefinite"/><text x="770" y="128" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="120" font-style="italic" letter-spacing=".6" fill="url(#gold)" stroke="#000" stroke-width="6" paint-order="stroke">6</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.4;0.5;1" dur="10s" repeatCount="indefinite"/><text x="770" y="128" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="120" font-style="italic" letter-spacing=".6" fill="url(#gold)" stroke="#000" stroke-width="6" paint-order="stroke">5</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.5;0.6;1" dur="10s" repeatCount="indefinite"/><text x="770" y="128" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="120" font-style="italic" letter-spacing=".6" fill="url(#gold)" stroke="#000" stroke-width="6" paint-order="stroke">4</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.6;0.7;1" dur="10s" repeatCount="indefinite"/><text x="770" y="128" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="120" font-style="italic" letter-spacing=".6" fill="url(#gold)" stroke="#000" stroke-width="6" paint-order="stroke">3</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.7;0.8;1" dur="10s" repeatCount="indefinite"/><text x="770" y="128" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="120" font-style="italic" letter-spacing=".6" fill="url(#gold)" stroke="#000" stroke-width="6" paint-order="stroke">2</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.8;0.9;1" dur="10s" repeatCount="indefinite"/><text x="770" y="128" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="120" font-style="italic" letter-spacing=".6" fill="url(#gold)" stroke="#000" stroke-width="6" paint-order="stroke">1</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.9;1.0;1" dur="10s" repeatCount="indefinite"/><text x="770" y="128" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="120" font-style="italic" letter-spacing=".6" fill="url(#gold)" stroke="#000" stroke-width="6" paint-order="stroke">0</text></g><text x="40" y="146" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="5" fill="#C9C3DE" >PRESS ANY BUTTON BELOW TO TALK</text><rect y="160" width="880" height="10" fill="url(#haz)" opacity=".85"/><rect width="880" height="170" fill="url(#scan)" opacity=".55"/></g><polygon points="20,0 880,0 880,150 860,170 0,170 0,20" stroke="#2B2040" stroke-width="1.5"/>
