<svg xmlns="http://www.w3.org/2000/svg" width="200" height="46" viewBox="0 0 200 46" fill="none" role="img" aria-label="All repos">
<title>All repos</title>
<defs>
<linearGradient id="og" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6B3D"/><stop offset="1" stop-color="#FFB24D"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#fff" stroke-opacity=".05"/></pattern>
<radialGradient id="fg" cx=".7" cy=".4" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="fade"><rect width="200" height="46" fill="url(#fg)"/></mask>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><rect width="200" height="46" rx="18"/></clipPath>

</defs>
<g><rect x="1" y="1" width="198" height="44" rx="23" fill="#111317" stroke="#FF6B3D" stroke-opacity=".8" stroke-width="1.5"/><text x="26" y="29" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#F3F0EA" >All repos</text><g><animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="1.8s" begin="0s" repeatCount="indefinite" /><text x="170" y="30" text-anchor="end" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#FF6B3D" >→</text></g></g>
</svg>
