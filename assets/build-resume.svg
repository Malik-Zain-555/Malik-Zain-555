<svg xmlns="http://www.w3.org/2000/svg" width="430" height="410" viewBox="0 0 430 410" fill="none" role="img" aria-label="Resume Category Classifier: 74.4%. test accuracy, up from 71.8% with TF-IDF. Sorts resumes into 24 job categories, and answers UNSURE when it isn't confident.">
