<svg xmlns="http://www.w3.org/2000/svg" width="430" height="340" viewBox="0 0 430 340" fill="none" role="img" aria-label="Titanic experiment: about 79.9 percent accuracy">
<title>Titanic experiment: about 79.9 percent accuracy</title>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".45" stop-color="#FFD23F"/><stop offset="1" stop-color="#FF2E4D"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2E4D"/><stop offset=".55" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FFD23F"/></linearGradient>
<linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#22E5FF"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" fill-opacity=".30"/></pattern>
<pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#FFD23F"/><rect x="8" width="8" height="16" fill="#07060B"/></pattern>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><polygon points="18,0 430,0 430,322 412,340 0,340 0,18"/></clipPath>

</defs>
<g clip-path="url(#card)"><rect width="430" height="340" fill="#0E0B14"/><circle cx="215" cy="168" r="120" fill="#FF2E4D" fill-opacity="0.16" filter="url(#blur)"/><text x="24" y="44" text-anchor="start" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="28" font-style="italic" letter-spacing=".6" fill="url(#gold)" >TRAINING RESULT</text><text x="24" y="66" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1.5" fill="#8F88AD" >TITANIC DATASET · LEARNING CHECKPOINT</text><g transform="rotate(-90 215 168)"><circle cx="215" cy="168" r="72" stroke="#2B2040" stroke-width="14"/><circle cx="215" cy="168" r="72" stroke="url(#hot)" stroke-width="14" stroke-dasharray="452.4" stroke-dashoffset="452.4" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="452.4;90.9;90.9;452.4" keyTimes="0.0000;0.2500;0.9000;1.0000" dur="9s" begin="0s" repeatCount="indefinite" /></circle></g><text x="215" y="182" text-anchor="middle" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="46" font-style="italic" letter-spacing=".6" fill="#F5F3FF" >79.9%</text><text x="215" y="204" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="3" fill="#8F88AD" >TEST ACCURACY</text><text x="215" y="280" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#F5F3FF" >Logistic Regression + feature standardisation</text><text x="215" y="302" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#C9C3DE" >Held-out test split. A learning checkpoint,</text><text x="215" y="320" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#C9C3DE" >not a claim of production ML experience.</text><rect width="430" height="340" fill="url(#scan)" opacity=".55"/></g><polygon points="18,0 430,0 430,322 412,340 0,340 0,18" stroke="#2B2040" stroke-width="1.5"/>
</svg>
