<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" fill="none" role="img" aria-label="Titanic experiment: about 79.9 percent accuracy with logistic regression">
<title>Titanic experiment: about 79.9 percent accuracy with logistic regression</title>
<defs>
<linearGradient id="aur" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<clipPath id="card"><rect width="480" height="340" rx="24"/></clipPath>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".09"/></pattern>
<radialGradient id="fadeg" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="fade"><rect width="480" height="340" fill="url(#fadeg)"/></mask>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

</defs>
<g clip-path="url(#card)"><rect width="480" height="340" fill="#0B0D1A"/><rect width="480" height="340" fill="url(#dots)" mask="url(#fade)"/><circle cx="240" cy="150" r="130" fill="#8B5CF6" fill-opacity="0.2" filter="url(#blur)"/>

<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient></defs>
<text x="32" y="44" font-family="ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="3" fill="#F472B6">ML CHECKPOINT · TITANIC</text>
<line x1="32" y1="62" x2="448" y2="62" stroke="#fff" stroke-opacity=".08"/>
<g transform="rotate(-90 240 150)">
  <circle cx="240" cy="150" r="72" stroke="#fff" stroke-opacity=".08" stroke-width="14"/>
  <circle cx="240" cy="150" r="72" stroke="url(#rg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="452.4" stroke-dashoffset="452.4" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="452.4;90.9;90.9;452.4" keyTimes="0;.25;.9;1" dur="9s" repeatCount="indefinite"/>
  </circle>
</g>
<text x="240" y="162" text-anchor="middle" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="800" fill="#E6E8F5">79.9%</text>
<text x="240" y="186" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="2.5" fill="#8B91B5">TEST ACCURACY</text>
<text x="240" y="260" text-anchor="middle" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#E6E8F5">Logistic Regression + feature standardisation</text>
<text x="240" y="284" text-anchor="middle" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#AEB4D6">Held-out test split · a learning checkpoint,</text>
<text x="240" y="303" text-anchor="middle" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#AEB4D6">not a claim of production ML experience.</text>

</g>
<rect x=".5" y=".5" width="479" height="339" rx="24" stroke="#1B1F3B"/>
</svg>
