" y="236" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#F3F0EA" >Regression).</text><text x="24" y="274" text-anchor="start" font-family="Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif" font-size="13.5" font-weight="400" font-style="italic" fill="#BDB9B0" >↳ Investigation: it learns the source's writing style, not</text><text x="24" y="293" text-anchor="start" font-family="Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif" font-size="13.5" font-weight="400" font-style="italic" fill="#BDB9B0" >   truth. A "Reuters" shortcut shows in the top weights.</text><line x1="44" y1="326" x2="386" y2="326" stroke="#272B33" stroke-width="2"/><line x1="44" y1="326" x2="386.0" y2="326" stroke="#4ADE9C" stroke-width="2"/><circle cx="44.0" cy="326" r="6" fill="#4ADE9C" stroke="#4ADE9C" stroke-width="2"/><text x="44.0" y="348" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" letter-spacing="0.5" fill="#F3F0EA" >DATA</text><circle cx="158.0" cy="326" r="6" fill="#4ADE9C" stroke="#4ADE9C" stroke-width="2"/><text x="158.0" y="348" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" letter-spacing="0.5" fill="#F3F0EA" >TF-IDF + LR</text><circle cx="272.0" cy="326" r="6" fill="#4ADE9C" stroke="#4ADE9C" stroke-width="2"/><text x="272.0" y="348" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" letter-spacing="0.5" fill="#F3F0EA" >~98%</text><circle cx="386.0" cy="326" r="6" fill="#4ADE9C" stroke="#4ADE9C" stroke-width="2"/><text x="386.0" y="348" text-anchor="middle" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" letter-spacing="0.5"