<g clip-path="url(#card)"><rect width="280" height="104" fill="#111317"/><g transform="translate(24 28) scale(.62)"><path d="M39 4 L70 16 V40 C70 58 56 70 39 76 C22 70 8 58 8 40 V16 Z" fill="#7AB7FF" fill-opacity=".25" stroke="#7AB7FF" stroke-width="6" stroke-linejoin="round"/></g><text x="92" y="50" text-anchor="start" font-family="Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif" font-size="28" font-weight="400" fill="#F3F0EA" >Guard</text><text x="92" y="72" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1" fill="#7AB7FF" >beats STRIKE</text><g><animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="1.6s" begin="0s" repeatCount="indefinite" /><text x="258" y="88" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1" fill="#FF6B3D" >play →</text></g><rect x="0" y="0" width="4" height="104" fill="#7AB7FF"/></g><rect x=".5" y=".5" width="279" height="103" rx="14" stroke="#272B33"/>
