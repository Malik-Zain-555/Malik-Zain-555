<svg xmlns="http://www.w3.org/2000/svg" width="280" height="130" viewBox="0 0 280 130" fill="none" role="img" aria-label="Guard: beats strike. Click to fight.">
<title>Guard: beats strike. Click to fight.</title>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".45" stop-color="#FFD23F"/><stop offset="1" stop-color="#FF2E4D"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2E4D"/><stop offset=".55" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FFD23F"/></linearGradient>
<linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#22E5FF"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" fill-opacity=".30"/></pattern>
<pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#FFD23F"/><rect x="8" width="8" height="16" fill="#07060B"/></pattern>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><polygon points="16,0 280,0 280,114 264,130 0,130 0,16"/></clipPath>

</defs>
<g clip-path="url(#card)"><rect width="280" height="130" fill="#0E0B14"/><circle cx="50" cy="50" r="80" fill="#22E5FF" fill-opacity="0.35" filter="url(#blur)"/><g transform="translate(26 26)" filter="url(#glow)"><path d="M39 4 L70 16 V40 C70 58 56 70 39 76 C22 70 8 58 8 40 V16 Z" fill="#22E5FF" fill-opacity=".25" stroke="#22E5FF" stroke-width="5" stroke-linejoin="round"/><path d="M39 22 V58 M24 36 H54" stroke="#22E5FF" stroke-width="4" stroke-linecap="round"/></g><text x="110" y="62" text-anchor="start" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="40" font-style="italic" letter-spacing=".6" fill="#F5F3FF" stroke="#000" stroke-width="5" paint-order="stroke">GUARD</text><text x="110" y="86" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" letter-spacing="2" fill="#22E5FF" >BEATS STRIKE</text><g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.5000;0.5000;1.0000" dur="1.0s" begin="0s" repeatCount="indefinite" /><text x="110" y="112" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2" fill="#FFD23F" >CLICK TO FIGHT ▶</text></g><rect x="-220" y="127" width="220" height="3" fill="#22E5FF" opacity=".9"><animate attributeName="x" from="-220" to="280" dur="3.5s" begin="0s" repeatCount="indefinite"/></rect><rect width="280" height="130" fill="url(#scan)" opacity=".55"/></g><polygon points="16,0 280,0 280,114 264,130 0,130 0,16" stroke="#22E5FF" stroke-width="1.5"/>
</svg>
