<svg xmlns="http://www.w3.org/2000/svg" width="880" height="188" viewBox="0 0 880 188" fill="none" role="img" aria-label="How I work: build first, real problems, honest labels">
<title>How I work: build first, real problems, honest labels</title>
<defs>
<linearGradient id="og" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6B3D"/><stop offset="1" stop-color="#FFB24D"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#fff" stroke-opacity=".05"/></pattern>
<radialGradient id="fg" cx=".7" cy=".4" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="fade"><rect width="880" height="188" fill="url(#fg)"/></mask>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><rect width="880" height="188" rx="18"/></clipPath>

</defs>
<g clip-path="url(#card)"><rect width="880" height="188" fill="#111317"/><text x="32" y="44" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="2" fill="#FF6B3D" >01</text><text x="32" y="80" text-anchor="start" font-family="Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif" font-size="28" font-weight="400" fill="#F3F0EA" >Build first.</text><text x="32" y="108" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#BDB9B0" >I learn by building, not by</text><text x="32" y="129" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#BDB9B0" >theory. No offense to theory, it</text><text x="32" y="150" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#BDB9B0" >just isn't how I learn.</text><line x1="304" y1="28" x2="304" y2="160" stroke="#272B33"/><text x="320" y="44" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="2" fill="#FF6B3D" >02</text><text x="320" y="80" text-anchor="start" font-family="Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif" font-size="28" font-weight="400" fill="#F3F0EA" >Real problems.</text><text x="320" y="108" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#BDB9B0" >Nothing meaningless. Each project</text><text x="320" y="129" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#BDB9B0" >solves something a real person</text><text x="320" y="150" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#BDB9B0" >would care about.</text><line x1="592" y1="28" x2="592" y2="160" stroke="#272B33"/><text x="608" y="44" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="2" fill="#FF6B3D" >03</text><text x="608" y="80" text-anchor="start" font-family="Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif" font-size="28" font-weight="400" fill="#F3F0EA" >Honest labels.</text><text x="608" y="108" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#BDB9B0" >AI-built, tutorial-guided or mine,</text><text x="608" y="129" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#BDB9B0" >I say which. Every time.</text></g><rect x=".5" y=".5" width="879" height="187" rx="18" stroke="#272B33"/>
</svg>
