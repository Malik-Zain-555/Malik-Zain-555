<g clip-path="url(#card)"><rect width="280" height="104" fill="#111317"/><g transform="translate(24 28) scale(.62)"><polygon points="39.0,3.0 47.8,26.9 73.2,27.9 53.3,43.6 60.2,68.1 39.0,54.0 17.8,68.1 24.7,43.6 4.8,27.9 30.2,26.9" fill="#FF7A90"/></g><text x="92" y="50" text-anchor="start" font-family="Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif" font-size="28" font-weight="400" fill="#F3F0EA" >Strike</text><text x="92" y="72" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1" fill="#FF7A90" >beats THROW</text><g><animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="1.6s" begin="0s" repeatCount="indefinite" /><text x="258" y="88" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1" fill="#FF6B3D" >play →</text></g><rect x="0" y="0" width="4" height="104" fill="#FF7A90"/></g><rect x=".5" y=".5" width="279" height="103" rx="14" stroke="#272B33"/>
