<g clip-path="url(#card)"><rect width="280" height="104" fill="#111317"/><g transform="translate(24 28) scale(.62)"><path d="M12 28 A28 28 0 0 1 62 24" stroke="#F5C451" stroke-width="7" stroke-linecap="round"/><path d="M66 50 A28 28 0 0 1 16 54" stroke="#F5C451" stroke-width="7" stroke-linecap="round"/><path d="M52 12 L64 26 L46 30Z" fill="#F5C451"/><path d="M26 66 L14 52 L32 48Z" fill="#F5C451"/></g><text x="92" y="50" text-anchor="start" font-family="Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif" font-size="28" font-weight="400" fill="#F3F0EA" >Throw</text><text x="92" y="72" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1" fill="#F5C451" >beats GUARD</text><g><animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="1.6s" begin="0s" repeatCount="indefinite" /><text x="258" y="88" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1" fill="#FF6B3D" >play →</text></g><rect x="0" y="0" width="4" height="104" fill="#F5C451"/></g><rect x=".5" y=".5" width="279" height="103" rx="14" stroke="#272B33"/>
