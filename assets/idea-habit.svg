<svg xmlns="http://www.w3.org/2000/svg" width="280" height="310" viewBox="0 0 280 310" fill="none" role="img" aria-label="Training mode concept: Habit &amp; Dev Tools">
<title>Training mode concept: Habit &amp; Dev Tools</title>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".45" stop-color="#FFD23F"/><stop offset="1" stop-color="#FF2E4D"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2E4D"/><stop offset=".55" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FFD23F"/></linearGradient>
<linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#22E5FF"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" fill-opacity=".30"/></pattern>
<pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#FFD23F"/><rect x="8" width="8" height="16" fill="#07060B"/></pattern>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><polygon points="16,0 280,0 280,294 264,310 0,310 0,16"/></clipPath>

</defs>
<g clip-path="url(#card)"><rect width="280" height="310" fill="#0E0B14"/><circle cx="260" cy="10" r="100" fill="#FF5FA2" fill-opacity="0.2" filter="url(#blur)"/><polygon points="0,0 150,0 136,24 0,24" fill="#FF5FA2"/><text x="12" y="17" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2" fill="#07060B" font-weight="700">TRAINING MODE</text><g transform="translate(224 40)"><g stroke="#FF5FA2" stroke-width="3" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="0 14 70;8 14 70;0 14 70;-8 14 70;0 14 70" dur="2.4s" begin="0.4s" repeatCount="indefinite" /><circle cx="14" cy="8" r="8"/><path d="M14 16V50M0 28H28M14 50L4 70M14 50L24 70"/></g></g><text x="20" y="104" text-anchor="start" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="20" font-style="italic" letter-spacing=".6" fill="#F5F3FF" >HABIT &amp; DEV TOOLS</text><text x="20" y="138" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#C9C3DE" >Habit tracking, daily planning,</text><text x="20" y="159" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#C9C3DE" >and a developer task tracker.</text><text x="20" y="180" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#C9C3DE" >Made to cut friction, not to add</text><text x="20" y="201" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#C9C3DE" >more organising.</text><text x="20" y="290" text-anchor="start" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.5" fill="#8F88AD" >NOT A LAUNCH · AN IDEA TO BUILD</text><rect x="-220" y="307" width="220" height="3" fill="#FF5FA2" opacity=".9"><animate attributeName="x" from="-220" to="280" dur="6s" begin="1s" repeatCount="indefinite"/></rect><rect width="280" height="310" fill="url(#scan)" opacity=".55"/></g><polygon points="16,0 280,0 280,294 264,310 0,310 0,16" stroke="#FF5FA2" stroke-width="1.5"/>
</svg>
