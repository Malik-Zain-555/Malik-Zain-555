<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372" fill="none" role="img" aria-label="Player 2 mode: Tekken, gaming, anime and movies, curiosity">
<title>Player 2 mode: Tekken, gaming, anime and movies, curiosity</title>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".45" stop-color="#FFD23F"/><stop offset="1" stop-color="#FF2E4D"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2E4D"/><stop offset=".55" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FFD23F"/></linearGradient>
<linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#22E5FF"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" fill-opacity=".30"/></pattern>
<pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#FFD23F"/><rect x="8" width="8" height="16" fill="#07060B"/></pattern>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><polygon points="14,0 880,0 880,358 866,372 0,372 0,14"/></clipPath>

</defs>
<g><g transform="translate(0 0)"><polygon points="14,0 430,0 430,162 416,176 0,176 0,14" fill="#0E0B14"/><polygon points="14,0 430,0 430,162 416,176 0,176 0,14" fill="#FF2E4D" fill-opacity=".07" stroke="#FF2E4D" stroke-opacity=".6" stroke-width="1.5"/><g transform="translate(24 24)" filter="url(#glow)"><path d="M10 10 L42 42 M42 10 L10 42" stroke="#FF2E4D" stroke-width="6" stroke-linecap="round"/></g><text x="92" y="58" text-anchor="start" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="26" font-style="italic" letter-spacing=".6" fill="#F5F3FF" >FIGHTING-GAME ARC</text><text x="24" y="100" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C3DE" >Tekken is movement, timing, and execution, and</text><text x="24" y="122" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C3DE" >learning from losses is its own training path.</text><text x="24" y="144" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C3DE" >Kazuya is my main.</text><rect x="24" y="158" width="50" height="4" fill="#FF2E4D"/></g><g transform="translate(450 0)"><polygon points="14,0 430,0 430,162 416,176 0,176 0,14" fill="#0E0B14"/><polygon points="14,0 430,0 430,162 416,176 0,176 0,14" fill="#A855F7" fill-opacity=".07" stroke="#A855F7" stroke-opacity=".6" stroke-width="1.5"/><g transform="translate(24 24)" filter="url(#glow)"><rect x="20" y="6" width="12" height="40" rx="3" fill="#A855F7"/><rect x="6" y="20" width="40" height="12" rx="3" fill="#A855F7"/></g><text x="92" y="58" text-anchor="start" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="26" font-style="italic" letter-spacing=".6" fill="#F5F3FF" >GAMING</text><text x="24" y="100" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C3DE" >Free Fire, Clash of Clans, Clash Royale, and</text><text x="24" y="122" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C3DE" >whatever looks fun to explore next.</text><rect x="24" y="158" width="50" height="4" fill="#A855F7"/></g><g transform="translate(0 196)"><polygon points="14,0 430,0 430,162 416,176 0,176 0,14" fill="#0E0B14"/><polygon points="14,0 430,0 430,162 416,176 0,176 0,14" fill="#FF5FA2" fill-opacity=".07" stroke="#FF5FA2" stroke-opacity=".6" stroke-width="1.5"/><g transform="translate(24 24)" filter="url(#glow)"><path d="M14 8 L46 26 L14 44Z" fill="#FF5FA2" stroke="#FF5FA2" stroke-width="3" stroke-linejoin="round"/></g><text x="92" y="58" text-anchor="start" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="26" font-style="italic" letter-spacing=".6" fill="#F5F3FF" >ANIME &amp; MOVIES</text><text x="24" y="100" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C3DE" >High-energy action, darker stories, and films that</text><text x="24" y="122" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C3DE" >leave emotional damage.</text><rect x="24" y="158" width="50" height="4" fill="#FF5FA2"/></g><g transform="translate(450 196)"><polygon points="14,0 430,0 430,162 416,176 0,176 0,14" fill="#0E0B14"/><polygon points="14,0 430,0 430,162 416,176 0,176 0,14" fill="#FFD23F" fill-opacity=".07" stroke="#FFD23F" stroke-opacity=".6" stroke-width="1.5"/><g transform="translate(24 24)" filter="url(#glow)"><circle cx="23" cy="23" r="14" stroke="#FFD23F" stroke-width="6"/><path d="M34 34 L48 48" stroke="#FFD23F" stroke-width="6" stroke-linecap="round"/></g><text x="92" y="58" text-anchor="start" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Heavy','Arial Black',sans-serif" font-size="26" font-style="italic" letter-spacing=".6" fill="#F5F3FF" >CURIOSITY MODE</text><text x="24" y="100" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C3DE" >I like learning how tools work under the hood, not</text><text x="24" y="122" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C3DE" >just which button to press.</text><rect x="24" y="158" width="50" height="4" fill="#FFD23F"/></g></g>
</svg>
